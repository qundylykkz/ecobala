<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>«Асық Ату» тренажеры</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Cute Rounded Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FACC15',
                        brandGold: '#D97706',
                        brandGoldHover: '#B45309',
                        kidBg: '#FEF9C3',
                        softBlue: '#38BDF8',
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        comfortaa: ['Comfortaa', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #FEF3C7;
            background-image: radial-gradient(#FDE047 2px, transparent 2px);
            background-size: 24px 24px;
            user-select: none;
        }

        .bouncy {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }

        .pulse-btn {
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(217, 119, 6, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
        }

        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Басты Контейнер -->
    <div id="game-container" class="w-full max-w-4xl bg-white rounded-3xl border-8 border-yellow-400 shadow-2xl overflow-hidden relative min-h-[550px] flex flex-col justify-between">
        
        <!-- Ойынның Бастапқы Экраны (Start Screen) -->
        <div id="start-screen" class="flex flex-col items-center justify-center flex-grow p-6 text-center space-y-6">
            <!-- Дөңгелектенген Асық Иконкасы -->
            <div class="w-32 h-32 md:w-40 md:h-40 bg-amber-400 rounded-3xl flex items-center justify-center shadow-lg transform -rotate-6 hover:rotate-0 transition-transform duration-300 border-4 border-amber-300">
                <!-- SVG Асық/Сүйек иконкасы -->
                <svg class="w-20 h-20 text-white drop-shadow-md" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="10" width="80" height="80" rx="20" fill="#FFFFFF"/>
                    <circle cx="30" cy="30" r="7" fill="#E11D48"/>
                    <circle cx="50" cy="50" r="7" fill="#4338CA"/>
                    <circle cx="70" cy="70" r="7" fill="#4338CA"/>
                    <circle cx="30" cy="70" r="7" fill="#4338CA"/>
                    <circle cx="70" cy="30" r="7" fill="#4338CA"/>
                </svg>
            </div>

            <div class="space-y-3 max-w-md">
                <h1 class="text-3xl md:text-5xl font-black text-gray-800 tracking-wide font-comfortaa">
                    «Асық Ату» тренажеры
                </h1>
                <p class="text-gray-600 text-lg md:text-xl font-medium leading-relaxed">
                    Мергендік пен зейінді арттыруға арналған ұлттық сандық ойын.
                </p>
            </div>

            <!-- Бастау Түймесі -->
            <button id="start-btn" onclick="startGame()" class="pulse-btn bg-amber-500 hover:bg-amber-600 text-white text-2xl font-bold px-10 py-5 rounded-2xl shadow-xl flex items-center gap-3 transition-transform active:scale-95 cursor-pointer border-b-4 border-amber-700">
                <i class="fa-solid fa-gamepad text-3xl"></i>
                <span>Ойынды бастау</span>
            </button>
        </div>

        <!-- Ойын Майданы (Play Screen - Әдепкіде жасырын) -->
        <div id="play-screen" class="hidden flex-col flex-grow relative w-full h-full bg-emerald-100">
            <!-- Жоғарғы Панель (Уақыт, Ұпай, Деңгей) -->
            <div class="bg-amber-400 p-4 border-b-4 border-amber-500 flex justify-between items-center px-6">
                <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl shadow-inner font-bold text-gray-700 text-lg">
                    <i class="fa-solid fa-trophy text-yellow-500 text-2xl"></i>
                    <span>Ұпай: <span id="score-val" class="text-amber-600">0</span></span>
                </div>
                
                <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl shadow-inner font-bold text-gray-700 text-lg">
                    <i class="fa-solid fa-bullseye text-red-500 text-2xl"></i>
                    <span>Деңгей: <span id="level-val" class="text-emerald-600">1</span></span>
                </div>

                <button onclick="exitGame()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl font-bold shadow-md active:scale-95">
                    <i class="fa-solid fa-house"></i>
                </button>
            </div>

            <!-- Инструкция -->
            <div class="text-center py-2 bg-emerald-200 text-emerald-800 text-sm md:text-base font-semibold">
                🎯 Сақаны тышқанмен немесе саусақпен артқа тартып, көздеп атыңыз!
            </div>

            <!-- Канвас (Ойын алаңы) -->
            <div class="relative flex-grow flex items-center justify-center p-2 min-h-[400px]">
                <canvas id="gameCanvas" class="w-full h-full rounded-2xl shadow-inner bg-emerald-600 border-4 border-emerald-700"></canvas>
            </div>

            <!-- Сандық сұрақ модалы (Зейін тренажеры) -->
            <div id="math-modal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-white border-8 border-yellow-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
                    <div class="text-5xl">🧠</div>
                    <h3 class="text-2xl font-black text-gray-800">Зейін Сұрағы!</h3>
                    <p id="math-question" class="text-3xl font-bold text-amber-600 bg-amber-50 p-4 rounded-xl border-2 border-amber-200">
                        2 + 3 = ?
                    </p>
                    <div id="math-options" class="grid grid-cols-2 gap-3">
                        <!-- Түймелер JS арқылы қосылады -->
                    </div>
                </div>
            </div>

            <!-- Ойын Аяқталу Модалы -->
            <div id="gameover-modal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-white border-8 border-emerald-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
                    <div class="text-6xl">🎉</div>
                    <h3 class="text-3xl font-black text-emerald-600">Керемет!</h3>
                    <p class="text-gray-600 text-lg">Сіз барлық асықты құлаттыңыз!</p>
                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-xl font-bold text-gray-700">
                        Жалпы ұпай: <span id="final-score" class="text-emerald-600">0</span>
                    </div>
                    <button onclick="restartGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-bold py-3 rounded-xl shadow-lg active:scale-95">
                        Қайта ойнау 🔄
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script>
        /* ================= ДЫБЫС ЭФФЕКТІЛЕРІ (Tone.js) ================= */
        let synth, hitSynth;
        
        function initAudio() {
            if (!synth) {
                synth = new Tone.Synth().toDestination();
                hitSynth = new Tone.MembraneSynth().toDestination();
            }
        }

        function playHitSound() {
            if (hitSynth) {
                hitSynth.triggerAttackRelease("C2", "8n");
            }
        }

        function playWinSound() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("C4", "8n", now);
                synth.triggerAttackRelease("E4", "8n", now + 0.15);
                synth.triggerAttackRelease("G4", "8n", now + 0.3);
                synth.triggerAttackRelease("C5", "4n", now + 0.45);
            }
        }

        function playCorrectSound() {
            if (synth) {
                synth.triggerAttackRelease("G4", "8n");
            }
        }

        /* ================= ОЙЫН ДЕРЕКТЕРІ БЕН АЙНЫМАЛЫЛАР ================= */
        const startScreen = document.getElementById('start-screen');
        const playScreen = document.getElementById('play-screen');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let level = 1;
        let isAiming = false;
        let sakha = { x: 0, y: 0, radius: 18, vx: 0, vy: 0, isShot: false };
        let asyks = [];
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        let animationFrameId;

        /* ================= ОЙЫНДЫ БАСТАУ ЖӘНЕ АЯҚТАУ ================= */
        function startGame() {
            initAudio();
            startScreen.classList.add('hidden');
            playScreen.classList.remove('hidden');
            playScreen.classList.add('flex');
            
            score = 0;
            level = 1;
            updateUI();
            
            resizeCanvas();
            resetBoard();
            
            window.addEventListener('resize', resizeCanvas);
            setupControls();
            
            animate();
        }

        function exitGame() {
            cancelAnimationFrame(animationFrameId);
            playScreen.classList.add('hidden');
            playScreen.classList.remove('flex');
            startScreen.classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('level-val').innerText = level;
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            resetSakha();
        }

        /* ================= АСЫҚТАРДЫ ЖАҢАРТУ БЕН ОРНАЛАС ТЫРУ ================= */
        function resetSakha() {
            sakha.x = canvas.width / 2;
            sakha.y = canvas.height - 50;
            sakha.vx = 0;
            sakha.vy = 0;
            sakha.isShot = false;
        }

        function resetBoard() {
            resetSakha();
            asyks = [];
            
            // Сақаға қарсы қойылатын асықтар саны
            const count = 3 + level;
            const startY = 120;
            const spacing = Math.min(canvas.width / (count + 1), 60);
            const startX = (canvas.width - (count - 1) * spacing) / 2;

            const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6'];

            for (let i = 0; i < count; i++) {
                asyks.push({
                    x: startX + i * spacing,
                    y: startY + (i % 2 === 0 ? 0 : 20),
                    radius: 16,
                    color: colors[i % colors.length],
                    isHit: false,
                    vx: 0,
                    vy: 0
                });
            }
        }

        /* ================= ВЕКТОРЛЫҚ АСЫҚТЫ САЛУ (SVG Стилінде) ================= */
        function drawAsyk(x, y, radius, color, isSakha = false) {
            ctx.save();
            ctx.translate(x, y);

            // Көлеңке
            ctx.beginPath();
            ctx.ellipse(0, radius, radius * 0.8, radius * 0.3, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fill();

            // Асық корпусы (негізгі пішіні)
            ctx.beginPath();
            ctx.roundRect(-radius, -radius * 1.2, radius * 2, radius * 2.4, 8);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#FFFFFF';
            ctx.stroke();

            // Асықтың ортасындағы шұңқыр (Оң жақ/Сол жақ)
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = isSakha ? '#FACC15' : 'rgba(255, 255, 255, 0.6)';
            ctx.fill();

            // Сақа болса ерекше қызыл нүкте (Торсық)
            if (isSakha) {
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = '#DC2626';
                ctx.fill();
            }

            ctx.restore();
        }

        /* ================= ДӨҢГЕЛЕТУ БЕН ФИЗИКА ================= */
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Алаңның ортасындағы сызық (Шеңбер)
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 140, Math.min(canvas.width * 0.4, 180), 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Тарту сызығы мен оқ (Атамдеген бағыт)
            if (isAiming) {
                ctx.beginPath();
                ctx.moveTo(sakha.x, sakha.y);
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                
                ctx.lineTo(sakha.x + dx, sakha.y + dy);
                ctx.strokeStyle = '#FACC15';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Стрелка көздеуіш
                ctx.beginPath();
                ctx.arc(sakha.x + dx, sakha.y + dy, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#FACC15';
                ctx.fill();
            }

            // Сақаның қозғалысы
            if (sakha.isShot) {
                sakha.x += sakha.vx;
                sakha.y += sakha.vy;
                sakha.vx *= 0.98; // Үйкеліс
                sakha.vy *= 0.98;

                // Кабырғадан ыршып қайту
                if (sakha.x - sakha.radius < 0 || sakha.x + sakha.radius > canvas.width) sakha.vx *= -1;
                if (sakha.y - sakha.radius < 0) sakha.vy *= -1;

                // Тоқтауды тексеру
                if (Math.abs(sakha.vx) < 0.2 && Math.abs(sakha.vy) < 0.2) {
                    resetSakha();
                }
            }

            // Асықтардың қозғалысы және соқтығысуы
            asyks.forEach((asyk, index) => {
                if (asyk.isHit) {
                    asyk.x += asyk.vx;
                    asyk.y += asyk.vy;
                    asyk.vx *= 0.95;
                    asyk.vy *= 0.95;
                }

                // Сақа мен Асықтың соқтығысуы
                const dist = Math.hypot(sakha.x - asyk.x, sakha.y - asyk.y);
                if (dist < sakha.radius + asyk.radius && !asyk.isHit) {
                    playHitSound();
                    asyk.isHit = true;
                    
                    // Соқтығысу физикасы
                    const angle = Math.atan2(asyk.y - sakha.y, asyk.x - sakha.x);
                    const force = Math.hypot(sakha.vx, sakha.vy) || 10;
                    
                    asyk.vx = Math.cos(angle) * force * 1.2;
                    asyk.vy = Math.sin(angle) * force * 1.2;
                    
                    sakha.vx *= 0.5;
                    sakha.vy *= 0.5;

                    // Зейін сұрағын ашу (Сақа тигенде)
                    setTimeout(() => triggerMathQuestion(), 300);
                }

                drawAsyk(asyk.x, asyk.y, asyk.radius, asyk.color, false);
            });

            // Сақаны салу
            drawAsyk(sakha.x, sakha.y, sakha.radius, '#D97706', true);

            // Барлық асықтар тигізілгенін тексеру
            const remaining = asyks.filter(a => !a.isHit);
            if (remaining.length === 0 && asyks.length > 0) {
                playWinSound();
                setTimeout(() => {
                    level++;
                    if (level > 3) {
                        showGameOver();
                    } else {
                        updateUI();
                        resetBoard();
                    }
                }, 500);
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        /* ================= БАСҚАРУ ЭЛЕМЕНТТЕРІ (MOUSe & TOUCH) ================= */
        function setupControls() {
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrag = (e) => {
                if (sakha.isShot) return;
                const pos = getPos(e);
                const dist = Math.hypot(pos.x - sakha.x, pos.y - sakha.y);
                if (dist < sakha.radius * 2) {
                    isAiming = true;
                    dragStart = pos;
                    dragCurrent = pos;
                }
            };

            const moveDrag = (e) => {
                if (!isAiming) return;
                dragCurrent = getPos(e);
            };

            const endDrag = () => {
                if (!isAiming) return;
                isAiming = false;

                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;

                // Сақаны ату
                sakha.vx = dx * 0.15;
                sakha.vy = dy * 0.15;
                sakha.isShot = true;
            };

            canvas.addEventListener('mousedown', startDrag);
            canvas.addEventListener('mousemove', moveDrag);
            window.addEventListener('mouseup', endDrag);

            canvas.addEventListener('touchstart', startDrag);
            canvas.addEventListener('touchmove', moveDrag);
            window.addEventListener('touchend', endDrag);
        }

        /* ================= ЗЕЙІН ТРЕНАЖЕРЫ (САНДЫҚ СҰРАҚТАР) ================= */
        function triggerMathQuestion() {
            const modal = document.getElementById('math-modal');
            const qEl = document.getElementById('math-question');
            const optEl = document.getElementById('math-options');

            // Қарапайым балаларға арналған математика
            const num1 = Math.floor(Math.random() * 5) + 1;
            const num2 = Math.floor(Math.random() * 5) + 1;
            const correct = num1 + num2;

            qEl.innerText = `${num1} + ${num2} = ?`;
            optEl.innerHTML = '';

            // Нұсқалар дайындау
            const options = [correct, correct + 1, Math.max(1, correct - 1), correct + 2];
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-amber-400 hover:bg-amber-500 text-white font-black text-2xl py-3 rounded-xl shadow border-b-4 border-amber-600 active:scale-95";
                btn.innerText = opt;
                btn.onclick = () => {
                    if (opt === correct) {
                        playCorrectSound();
                        score += 50;
                    } else {
                        score += 10;
                    }
                    updateUI();
                    modal.classList.add('hidden');
                };
                optEl.appendChild(btn);
            });

            modal.classList.remove('hidden');
        }

        function showGameOver() {
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('gameover-modal').classList.add('hidden');
            startGame();
        }

        window.onload = function() {
            // Ойын жүктелді
        };
    </script>
</body>
</html>
