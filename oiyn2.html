<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>«Этно-Лабиринт» квесті</title>
    <!-- Montserrat шрифтін жүктеу -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome иконкалары -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti кітапханасы (Жеңіс фейервергі үшін) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #10B981;
            --primary-dark: #059669;
            --accent-yellow: #FBBF24;
            --accent-orange: #F97316;
            --accent-blue: #06B6D4;
            --bg-color: #ECFDF5;
            --card-bg: #FFFFFF;
            --text-color: #1F2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #A7F3D0;
            background-image: 
                radial-gradient(#34D399 2px, transparent 2px), 
                radial-gradient(#34D399 2px, #E6FFFA 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-color);
        }

        .game-container {
            background: white;
            border: 6px solid #10B981;
            border-radius: 36px;
            padding: 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 0 0 10px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Қазақы ою-өрнек декорациясы */
        .ornament-top {
            width: 100%;
            height: 18px;
            background: repeating-linear-gradient(45deg, #10B981, #10B981 15px, #FBBF24 15px, #FBBF24 30px);
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .title-badge {
            background: #DEF7EC;
            color: #03543F;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            border: 2px solid #31C48D;
        }

        .main-title {
            color: #065F46;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 0px #A7F3D0;
        }

        .subtitle {
            color: #4B5563;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Ойын экраны және Старт терезесі */
        .start-card {
            background: #F0FDF4;
            border: 3px dashed #34D399;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .icon-box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #10B981, #059669);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            animation: pulse 2s infinite;
        }

        .icon-box i {
            font-size: 50px;
            color: #FDE047;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .btn {
            background: linear-gradient(180deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            border-bottom: 5px solid #047857;
            padding: 14px 32px;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.15s ease;
            box-shadow: 0 8px 15px rgba(5, 150, 105, 0.3);
            width: 85%;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
            box-shadow: none;
        }

        /* Ойын интерфейсі */
        .game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            padding: 10px 16px;
            background: #ECFDF5;
            border-radius: 16px;
            border: 2px solid #A7F3D0;
            font-weight: 700;
            color: #065F46;
        }

        .target-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .target-emoji {
            font-size: 1.4rem;
        }

        /* Лабиринт Канвасы */
        #mazeCanvas {
            background: #FFFFFF;
            border: 4px solid #10B981;
            border-radius: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            touch-action: none;
            max-width: 100%;
        }

        /* Сенсорлық Басқару Панелі (Джойстик кнопкалары) */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
            width: 200px;
        }

        .ctrl-btn {
            background: #F3F4F6;
            border: 2px solid #D1D5DB;
            border-bottom: 4px solid #9CA3AF;
            border-radius: 16px;
            height: 50px;
            font-size: 1.4rem;
            color: #374151;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .ctrl-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            background: #E5E7EB;
        }

        .ctrl-up { grid-column: 2; }
        .ctrl-left { grid-column: 1; grid-row: 2; }
        .ctrl-down { grid-column: 2; grid-row: 2; }
        .ctrl-right { grid-column: 3; grid-row: 2; }

        /* Модальді терезе (Жеңіс) */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 30px;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: 28px;
            padding: 25px;
            text-align: center;
            max-width: 90%;
            border: 5px solid #FBBF24;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-title {
            color: #D97706;
            font-size: 1.6rem;
            font-weight: 900;
            margin: 10px 0;
        }

        .win-desc {
            color: #4B5563;
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-weight: 1.4;
        }

        /* Жауап беретіндік (Responsive) */
        @media (max-width: 480px) {
            .game-container {
                padding: 15px;
            }
            .main-title {
                font-size: 1.4rem;
            }
            .btn {
                font-size: 1.05rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="ornament-top"></div>

        <div class="header">
            <div class="title-badge">
                <i class="fa-solid fa-puzzle-piece"></i> Ұлттық Ойын
            </div>
            <h1 class="main-title">«Этно-Лабиринт» квесті</h1>
            <p class="subtitle">Саусақ бұлшықеттері мен логиканы дамытуға арналған лабиринт.</p>
        </div>

        <!-- Бастапқы Экраны -->
        <div id="startScreen" class="start-card">
            <div class="icon-box">
                <i class="fa-solid fa-puzzle-piece"></i>
            </div>
            <p style="font-weight:600; color:#374151; line-height: 1.5;">
                Батырға этно-бұйымдарды табуға көмектес!<br>Пернетақта немесе батырмалар арқылы басқар.
            </p>
            <button class="btn" onclick="startGame()">
                <i class="fa-solid fa-gamepad"></i> Ойынды бастау
            </button>
        </div>

        <!-- Ойын Экраны -->
        <div id="gameScreen" class="game-area">
            <div class="status-bar">
                <div id="levelDisplay">Деңгей: 1/5</div>
                <div class="target-info">
                    <span>Мақсат:</span>
                    <span id="targetName" style="color:#D97706;">Киіз үй</span>
                    <span id="targetEmoji" class="target-emoji">🎪</span>
                </div>
            </div>

            <!-- Лабиринт салу алаңы -->
            <canvas id="mazeCanvas" width="360" height="360"></canvas>

            <!-- Дисплейдегі джойстик (Батырмалар) -->
            <div class="controls">
                <button class="ctrl-btn ctrl-up" onclick="movePlayer(0, -1)"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="ctrl-btn ctrl-left" onclick="movePlayer(-1, 0)"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="ctrl-btn ctrl-down" onclick="movePlayer(0, 1)"><i class="fa-solid fa-arrow-down"></i></button>
                <button class="ctrl-btn ctrl-right" onclick="movePlayer(1, 0)"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Жеңіс Модаль Терезесі -->
        <div id="winModal" class="modal-overlay">
            <div class="modal-card">
                <div style="font-size: 3.5rem;">🎉</div>
                <h2 id="winTitle" class="win-title">Керемет!</h2>
                <p id="winDesc" class="win-desc">Сіз бұйымды таптыңыз!</p>
                <button class="btn" onclick="nextLevel()">
                    Келесі деңгей <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Этно-заттар тізімі
        const targets = [
            { name: "Киіз үй", emoji: "🎪", info: "Бұл — көшпелі бабаларымыздың киелі баспанасы!" },
            { name: "Домбыра", emoji: "🪕", info: "Қазақтың ұлттық екі шекті музыкалық аспабы." },
            { name: "Торсық", emoji: "🍶", info: "Қымыз бен шұбат құятын теріден жасалған ыдыс." },
            { name: "Тайқазан", emoji: "🍲", info: "Береке мен бірліктің символы болған қасиетті қазан." },
            { name: "Бүркіт", emoji: "🦅", info: "Қазақ халқының еркіндік пен батырлық символы." }
        ];

        let currentLevel = 0;
        const gridSizes = [5, 7, 9, 11, 13]; // Бірінші деңгейді жеңілдету үшін 5x5 қылдық
        let gridSize = 5;
        let cellSize = 0;
        let maze = [];
        let playerPos = { x: 0, y: 0 };
        let goalPos = { x: 0, y: 0 };

        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            currentLevel = 0;
            loadLevel(currentLevel);
        }

        function loadLevel(levelIndex) {
            gridSize = gridSizes[levelIndex];
            cellSize = canvas.width / gridSize;
            
            // Мақсатты жаңарту
            document.getElementById('levelDisplay').innerText = `Деңгей: ${levelIndex + 1}/${targets.length}`;
            document.getElementById('targetName').innerText = targets[levelIndex].name;
            document.getElementById('targetEmoji').innerText = targets[levelIndex].emoji;

            // Әрқашан шешімі бар лабиринтті генерациялау
            generateMaze(gridSize);
            
            playerPos = { x: 0, y: 0 };
            goalPos = { x: gridSize - 1, y: gridSize - 1 };

            drawMaze();
        }

        // Кез келген нүктеге жол ашық болатын 100% өтуге болатын лабиринт алгоритмі (Recursive Backtracker)
        function generateMaze(size) {
            maze = [];
            for (let r = 0; r < size; r++) {
                let row = [];
                for (let c = 0; c < size; c++) {
                    row.push({
                        x: c,
                        y: r,
                        top: true,
                        right: true,
                        bottom: true,
                        left: true,
                        visited: false
                    });
                }
                maze.push(row);
            }

            let stack = [];
            let current = maze[0][0];
            current.visited = true;

            function getNeighbors(cell) {
                let neighbors = [];
                let { x, y } = cell;

                if (y > 0 && !maze[y - 1][x].visited) neighbors.push({ cell: maze[y - 1][x], dir: 'top' });
                if (x < size - 1 && !maze[y][x + 1].visited) neighbors.push({ cell: maze[y][x + 1], dir: 'right' });
                if (y < size - 1 && !maze[y + 1][x].visited) neighbors.push({ cell: maze[y + 1][x], dir: 'bottom' });
                if (x > 0 && !maze[y][x - 1].visited) neighbors.push({ cell: maze[y][x - 1], dir: 'left' });

                return neighbors;
            }

            let unvisitedCount = size * size - 1;

            while (unvisitedCount > 0) {
                let neighbors = getNeighbors(current);

                if (neighbors.length > 0) {
                    let nextObj = neighbors[Math.floor(Math.random() * neighbors.length)];
                    let next = nextObj.cell;

                    // Жол ашу (қабырғаны алып тастау)
                    if (nextObj.dir === 'top') {
                        current.top = false;
                        next.bottom = false;
                    } else if (nextObj.dir === 'right') {
                        current.right = false;
                        next.left = false;
                    } else if (nextObj.dir === 'bottom') {
                        current.bottom = false;
                        next.top = false;
                    } else if (nextObj.dir === 'left') {
                        current.left = false;
                        next.right = false;
                    }

                    next.visited = true;
                    stack.push(current);
                    current = next;
                    unvisitedCount--;
                } else if (stack.length > 0) {
                    current = stack.pop();
                }
            }
        }

        // Лабиринт пен кейіпкерлерді салу
        function drawMaze() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Фоны (торкөздері анық болуы үшін)
            ctx.fillStyle = "#F0FDF4";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Қабырғаларды салу
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = Math.max(4, 12 - gridSize);
            ctx.lineCap = 'round';

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    let x = c * cellSize;
                    let y = r * cellSize;
                    let cell = maze[r][c];

                    if (cell.top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); ctx.stroke(); }
                    if (cell.right) { ctx.beginPath(); ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
                    if (cell.bottom) { ctx.beginPath(); ctx.moveTo(x, y + cellSize); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
                    if (cell.left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize); ctx.stroke(); }
                }
            }

            // Мақсатты салу (Этно-бұйым)
            ctx.font = `${cellSize * 0.6}px Montserrat`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let goalX = goalPos.x * cellSize + cellSize / 2;
            let goalY = goalPos.y * cellSize + cellSize / 2;
            ctx.fillText(targets[currentLevel].emoji, goalX, goalY);

            // Ойыншыны салу (Батыр / Бала эмодзи)
            let playerX = playerPos.x * cellSize + cellSize / 2;
            let playerY = playerPos.y * cellSize + cellSize / 2;
            ctx.fillText('🧒', playerX, playerY);
        }

        // Ойыншыны қозғалту
        function movePlayer(dx, dy) {
            let currentCell = maze[playerPos.y][playerPos.x];

            if (dx === 0 && dy === -1 && !currentCell.top) playerPos.y--;
            else if (dx === 1 && dy === 0 && !currentCell.right) playerPos.x++;
            else if (dx === 0 && dy === 1 && !currentCell.bottom) playerPos.y++;
            else if (dx === -1 && dy === 0 && !currentCell.left) playerPos.x--;

            drawMaze();
            checkWin();
        }

        // Пернетақта арқылы басқару
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('gameScreen').style.display === 'flex') {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, -1);
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0);
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, 1);
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0);
            }
        });

        // Жеңісті тексеру
        function checkWin() {
            if (playerPos.x === goalPos.x && playerPos.y === goalPos.y) {
                // Салют / Конфетти эффектісі
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    document.getElementById('winTitle').innerText = `Жарайсың! 🎉`;
                    document.getElementById('winDesc').innerHTML = `<b>${targets[currentLevel].name}</b> таптың!<br><br><small style="color:#059669">${targets[currentLevel].info}</small>`;
                    document.getElementById('winModal').style.display = 'flex';
                }, 200);
            }
        }

        function nextLevel() {
            document.getElementById('winModal').style.display = 'none';
            currentLevel++;
            if (currentLevel < targets.length) {
                loadLevel(currentLevel);
            } else {
                // Ойын толық аяқталғанда
                document.getElementById('winTitle').innerText = `Құттықтаймыз! 🏆`;
                document.getElementById('winDesc').innerText = `Сіз барлық этно-лабиринттерден сәтті өтіп, барлық мұраны жинадыңыз!`;
                
                let btn = document.querySelector('#winModal .btn');
                btn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Қайта бастау`;
                btn.onclick = () => {
                    document.getElementById('winModal').style.display = 'none';
                    btn.innerHTML = `Келесі деңгей <i class="fa-solid fa-arrow-right"></i>`;
                    btn.onclick = nextLevel;
                    startGame();
                };
                document.getElementById('winModal').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
